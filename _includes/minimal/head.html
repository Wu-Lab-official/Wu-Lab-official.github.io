{% assign desc = page.description | default: site.description | strip_html | escape %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ desc }}">
{% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" href="{{ '/assets/minimal/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/minimal/style.css' | relative_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
<meta property="og:description" content="{{ desc }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:locale" content="zh_CN">
<meta name="twitter:card" content="summary">
