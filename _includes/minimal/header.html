<header class="masthead">
  <div class="shell masthead-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-cn">吴昌进课题组</span>
      <span class="brand-en">Wu Lab · 清华大学深圳国际研究生院</span>
    </a>
    <nav class="nav" id="site-nav" aria-label="主导航">
      {% for item in site.data.navigation.main %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">菜单</button>
  </div>
</header>
