# 站点配置（极简主题）。改完必须重启 jekyll serve —— 配置文件不热加载。
# 内容改哪里见 MAINTENANCE.md §3；事实来源见 CONTENT.md。

title       : "Wu-Lab"
description : "吴昌进课题组（Wu-Lab）：清华大学深圳国际研究生院，研究方向为活性软物质与智能系统——微纳机器人、微流控、集群智能"
url         : "https://wu-lab-official.github.io"
baseurl     : ""
repository  : "Wu-Lab-official/Wu-Lab-official.github.io"
lang        : zh-CN
timezone    : Asia/Shanghai

author:
  name     : "吴昌进 Changjin Wu"
  bio      : "清华大学深圳国际研究生院 助理教授、特别研究员、博士生导师"
  location : "深圳 · 能源环境大楼 2107"
  employer : "清华大学深圳国际研究生院"
  uri      : "https://www.sigs.tsinghua.edu.cn/wcj/main.htm"
  email    : "wuchangjin@sz.tsinghua.edu.cn"

# Markdown
markdown    : kramdown
highlighter : rouge
kramdown:
  input: GFM

# 插件：sitemap 生成 sitemap.xml；其余模板插件已随旧布局移除
plugins:
  - jekyll-sitemap

# _pages 是下划线目录，必须显式 include 才会被当作页面处理
include:
  - _pages

# 注：feed.xml 由 github-pages 插件组自动生成（本站无 posts，内容为空）；
# jekyll-feed 不支持通过 feed: false 关闭，属已知无害产物。

# 不发布到线上的文件（仓库仍是公开的，见 CONTENT.md §5）
exclude:
  - README.md
  - AGENTS.md
  - CONTENT.md
  - MAINTENANCE.md
  - TOOLBOOK.md
  - WORKLOG.md
  - LICENSE
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
